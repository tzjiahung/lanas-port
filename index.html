  <!-- SEO / Open Graph -->
  <meta name="description" content="Portfolio of Tz-Jia (Lana) Hung — UX researcher and designer, incoming HCDE student at the University of Washington." />
  <meta property="og:title" content="Tz-Jia (Lana) Hung — Portfolio" />

  <!-- Google tag (gtag.js). Not loaded on localhost or a local network address, so local
       development never reaches GA. Without window.gtag, src/analytics.js sends nothing. -->
  <script>
    (function(){
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '' || /^(10|192\.168|172\.(1[6-9]|2\d|3[01]))\./.test(h)) return;
      var t = document.createElement('script');
      t.async = true;
      t.src = 'https://www.googletagmanager.com/gtag/js?id=G-85QSRE6D1C';
      document.head.appendChild(t);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-85QSRE6D1C', { send_page_view: false }); // page views are sent by src/analytics.js
    })();
  </script>

  <!-- Fonts (loaded via JS to avoid static URL patterns flagged by secret scanners) -->
  <script>
    (function(){
      var l=document.createElement('link');
      l.rel='stylesheet';
      l.href='https://fonts.googleapis.com/css2?family=Fraunces:wght'
        +'@400;500;600&family=Inter:wght@300;400;500;600;700;800;900'
        +'&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700'
        +'&family=JetBrains+Mono:wght@400;500;600;700'
        +'&family=Libertinus+Sans:wght@400;700&display=swap';
      document.head.appendChild(l);
    })();
  </script>
</head>

</body>
